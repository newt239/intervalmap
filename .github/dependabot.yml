version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: quarterly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    ignore:
      # @cloudflare/vitest-pool-workers が vitest 4 までしか対応していない
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
    groups:
      production-dependencies:
        dependency-type: production
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: quarterly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
